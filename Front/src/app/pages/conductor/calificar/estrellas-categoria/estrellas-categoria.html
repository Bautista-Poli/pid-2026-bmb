<!-- Una categoria de la calificacion con sus 5 estrellas. Datos en estrellas-categoria.ts. -->
@let c = categoria();
<div class="min-w-0">
  <p class="categoria-nombre" [id]="'cat-' + c.codigo">{{ c.nombre }}</p>
  <p class="categoria-ayuda">{{ c.ayuda }}</p>
</div>
<div class="estrellas" role="radiogroup" [attr.aria-labelledby]="'cat-' + c.codigo">
  @for (valor of estrellas; track valor) {
    <button
      type="button"
      role="radio"
      class="estrella"
      [class.estrella--llena]="nota() >= valor"
      [attr.aria-checked]="nota() === valor"
      [attr.aria-label]="etiquetaEstrella(valor)"
      (click)="notaChange.emit(valor)"
    >
      <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true">
        <path
          d="M12 3.8l2.5 5 5.5.8-4 3.9.9 5.5-4.9-2.6L7.1 19l.9-5.5-4-3.9 5.5-.8Z"
          stroke-width="1.5"
          stroke-linejoin="round"
        />
      </svg>
    </button>
  }
</div>
