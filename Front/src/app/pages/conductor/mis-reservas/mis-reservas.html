<!-- Pantalla `/conductor/mis-reservas` · rol CONDUCTOR. Datos y acciones en mis-reservas.ts. -->
<div class="aparece vista-mis-reservas">
  <div class="columna-vista">
    <header>
      <p class="eyebrow">Conductor</p>
      <h1 class="titulo-vista titulo-pagina">Mis reservas</h1>

      <app-pestanias-reservas
        class="pestanias"
        [activa]="pestania()"
        [cantidades]="cantidades()"
        [cargando]="recurso.isLoading()"
        (cambiar)="cambiarPestania($event)"
      />
    </header>

    @if (aviso(); as mensaje) {
      <p class="aviso-exito" role="status">
        {{ mensaje }} La vas a encontrar en Historial, con las canceladas.
      </p>
    }

    <app-invitacion-calificar [reservas]="pasadas()" />

    @if (recurso.isLoading()) {
      <ui-cargando [cantidad]="2" />
    } @else if (recurso.error(); as error) {
      <ui-estado-vacio titulo="No pudimos cargar tus reservas" [descripcion]="error.message">
        <ui-boton (presionado)="recurso.reload()">Reintentar</ui-boton>
      </ui-estado-vacio>
    } @else if (pestania() === 'PROXIMAS') {
      <app-reservas-proximas [reservas]="proximas()" (cancelada)="alCancelar($event)" />
    } @else if (pestania() === 'EN_CURSO') {
      <app-reservas-en-curso [reservas]="enCurso()" />
    } @else {
      <app-historial-reservas [reservas]="pasadas()" [(mostrarSinUsar)]="mostrarSinUsar" />
    }
  </div>
</div>
