<!-- Pestaña "Vigentes" de Mis reservas. Datos y acciones en reservas-vigentes.ts. -->
@if (reservas().length === 0) {
  <ui-estado-vacio
    titulo="No tenes reservas activas"
    descripcion="Cuando reserves una cochera la vas a ver aca."
  >
    <ui-boton routerLink="/conductor/explorar">Explorar estacionamientos</ui-boton>
  </ui-estado-vacio>
} @else {
  <div class="columna-vigentes">
    @for (reserva of enCurso(); track reserva.id) {
      <app-tarjeta-en-curso class="aparece" [reserva]="reserva" />
    }

    @if (proximas().length > 0) {
      <section class="grupo-seccion" aria-labelledby="titulo-proximas">
        <h2 id="titulo-proximas" class="eyebrow eyebrow-neutro">Próximas</h2>
        <div class="aparece-en-cadena lista-reservas">
          @for (reserva of proximas(); track reserva.id) {
            <app-tarjeta-proxima
              [reserva]="reserva"
              [cancelando]="cancelandoId() === reserva.id"
              (cancelar)="pedirCancelacion($event)"
            />
          }
        </div>
      </section>
    }
  </div>
}

<app-cancelar-reserva
  [reserva]="aCancelar()"
  [cancelando]="cancelandoId() !== null"
  [error]="errorCancelar()"
  (cerrado)="cerrarCancelacion()"
  (confirmar)="confirmarCancelacion()"
/>
