<!-- Tarjeta de la reserva en curso del conductor. Datos y reloj en tarjeta-en-curso.ts. -->
@let r = reserva();

<article class="overflow-hidden rounded-tarjeta border border-acento-borde bg-papel shadow-tarjeta">
  <!-- Cuanto lleva, cuanto falta y la barra de la franja. -->
  <div class="border-b border-acento-borde bg-acento-suave px-5 pt-4 pb-5 lg:px-6">
    <div class="flex items-center justify-between gap-3">
      <app-estado-reserva [reserva]="r" />
      <span class="text-[12.5px] text-grafito">{{ fechaLarga() }}</span>
    </div>

    <div class="mt-4 flex flex-col gap-1 lg:flex-row lg:items-end lg:justify-between">
      <div>
        <p class="text-[12.5px] text-grafito">Lleva</p>
        <p
          class="num-tabular text-[34px] leading-tight font-semibold tracking-[-0.025em]
                 text-tinta lg:text-[40px]"
          aria-live="polite"
        >
          {{ lleva() }}
        </p>
      </div>
      <p class="num-tabular text-[13px] text-grafito lg:pb-2">
        Termina a las {{ r.horaHasta }} · {{ falta() }}
      </p>
    </div>

    <div
      class="mt-4 h-2 overflow-hidden rounded-full bg-borde"
      role="progressbar"
      aria-label="Avance de la reserva"
      [attr.aria-valuenow]="progreso()"
      aria-valuemin="0"
      aria-valuemax="100"
    >
      <div
        class="h-full rounded-full bg-exito transition-[width] duration-500 ease-out"
        [style.width.%]="progreso()"
      ></div>
    </div>
    <div class="num-tabular mt-2 flex justify-between text-[11.5px] text-plomo">
      <span>{{ r.horaDesde }}</span>
      <span>{{ r.horaHasta }}</span>
    </div>
  </div>

  <div class="flex flex-col gap-1 px-5 pt-5 lg:px-6">
    <h3 class="text-[16px] font-semibold text-tinta">{{ r.estacionamiento.nombre }}</h3>
    <p class="flex items-center gap-1.5 text-[12.5px] text-plomo">
      <ui-icono nombre="explorar" [tamano]="15" />
      {{ direccion() }}
    </p>
  </div>

  <app-vehiculo-y-cochera class="px-5 pt-4 lg:px-6" [reserva]="r" />
  <app-como-llegar class="px-5 pt-3 lg:px-6" [reserva]="r" />

  @if (r.motivoReasignacion) {
    <div class="px-5 pt-3 lg:px-6">
      <app-aviso-reasignacion [reserva]="r" />
    </div>
  }

  <footer class="mt-4 flex items-center justify-between gap-3 border-t border-borde-sutil px-5 py-3.5 lg:px-6">
    <app-precio-reserva [reserva]="r" />
    <!-- Lo necesita para salir, aunque ya haya pasado su fin. -->
    <app-ver-qr [reserva]="r" />
  </footer>
</article>
