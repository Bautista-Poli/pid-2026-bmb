<!-- Filas seleccionables de vehiculo, con radio button a la derecha. Datos y acciones en selector-vehiculo.ts. -->
<ul class="grid gap-2.5 lg:grid-cols-2" role="radiogroup" aria-label="Vehiculo">
  @for (vehiculo of vehiculos(); track vehiculo.id) {
    <li>
      <button
        type="button"
        class="opcion"
        role="radio"
        [class.opcion--activa]="seleccionado() === vehiculo.id"
        [attr.aria-checked]="seleccionado() === vehiculo.id"
        (click)="seleccionado.set(vehiculo.id)"
      >
        <span class="flex min-w-0 flex-col text-left">
          <span class="num-tabular truncate text-[14px] font-semibold text-tinta">
            {{ vehiculo.patente }}
          </span>
          <span class="mt-0.5 truncate text-[12px] text-plomo">
            {{ vehiculo.marca }} {{ vehiculo.modelo }} · {{ etiquetaTipo[vehiculo.tipo] }}
          </span>
        </span>

        <span class="radio" aria-hidden="true"></span>
      </button>
    </li>
  }
</ul>
