<ui-tarjeta [interactiva]="true">
  <div class="flex h-full flex-col gap-4 lg:gap-[18px]">
    <!-- Foto + nombre + tarifa -->
    <div class="flex items-start justify-between gap-4">
      <div class="flex min-w-0 items-start gap-3.5">
        <ui-miniatura [src]="estacionamiento().fotoUrl" [optimizada]="false" icono="estacionamiento" />
        <div class="min-w-0">
          <h3 class="text-[16px] leading-tight font-semibold tracking-[-0.01em] text-tinta lg:text-[17px]">
            {{ estacionamiento().nombre }}
          </h3>
          <p class="mt-1 text-[13px] leading-normal text-plomo">{{ ubicacion() }}</p>
          <p class="num-tabular mt-2 text-[12.5px] font-medium text-tinta">{{ tarifas() }}</p>
        </div>
      </div>
    </div>

    <div class="h-px bg-borde-sutil"></div>

    <!-- Disponibilidad + horario (en desktop tambien el boton) -->
    <div class="mt-auto flex items-center justify-between gap-3">
      <div class="flex min-w-0 items-center gap-2.5">
        <ui-punto-estado [tono]="tono()" />
        <span class="truncate text-[12.5px] font-medium text-grafito">{{ disponibilidad() }}</span>
      </div>

      <div class="flex shrink-0 items-center gap-3.5">
        <span class="num-tabular text-[12px] text-plomo">{{ horario() }}</span>
        <div class="hidden lg:block">
          <ui-boton
            variante="primario"
            tamano="sm"
            [deshabilitado]="libres() === 0"
            (presionado)="reservar.emit(estacionamiento())"
          >
            Reservar
          </ui-boton>
        </div>
      </div>
    </div>

    <!-- Mobile: boton de ancho completo -->
    <div class="lg:hidden">
      <ui-boton
        variante="primario"
        [bloque]="true"
        [deshabilitado]="libres() === 0"
        (presionado)="reservar.emit(estacionamiento())"
      >
        Reservar
      </ui-boton>
    </div>
  </div>
</ui-tarjeta>
