<!-- Lo que ve el conductor despues de calificar. Datos en calificacion-enviada.ts. -->
<section class="enviada" role="status">
  <span class="enviada__icono" aria-hidden="true">
    <svg width="32" height="32" viewBox="0 0 24 24" fill="currentColor">
      <path d="M12 3.8l2.5 5 5.5.8-4 3.9.9 5.5-4.9-2.6L7.1 19l.9-5.5-4-3.9 5.5-.8Z" />
    </svg>
  </span>
  <h1 class="titulo-vista">¡Gracias por calificar!</h1>
  <p class="enviada__texto">
    Le diste {{ promedio() }} de 5 a {{ estacionamiento() }}. Tu opinión ayuda a otros
    conductores a elegir.
  </p>
  <ui-boton variante="primario" routerLink="/conductor/mis-reservas">Volver a mis reservas</ui-boton>
</section>
