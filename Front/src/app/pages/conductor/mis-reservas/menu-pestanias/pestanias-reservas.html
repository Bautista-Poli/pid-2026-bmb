<!-- Menu de pestañas de Mis reservas. Datos en pestanias-reservas.ts. -->
@for (pestania of pestanias; track pestania.clave) {
  <ui-chip [activo]="activa() === pestania.clave" (alternar)="cambiar.emit(pestania.clave)">
    {{ pestania.titulo }}
    @if (!cargando()) {
      <span class="num-tabular contador-pestania">
        {{ cantidades()[pestania.clave] }}
      </span>
    }
  </ui-chip>
}
