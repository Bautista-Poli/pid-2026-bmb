<div class="relative flex min-h-dvh items-center justify-center overflow-hidden bg-lienzo px-6 py-12">
  <!-- Halo del acento detras de la tarjeta: la unica pieza decorativa de la app -->
  <div
    class="pointer-events-none absolute -top-40 left-1/2 h-[420px] w-[620px] -translate-x-1/2
           rounded-full bg-acento/8 blur-3xl"
    aria-hidden="true"
  ></div>

  <div class="aparece relative w-full max-w-[400px]">
    <header class="mb-7 flex flex-col items-center text-center">
      <img
        ngSrc="logo-parkit.png"
        width="400"
        height="352"
        priority
        alt="Parkit"
        class="h-auto w-[124px]"
      />
      <h1 class="titulo-vista mt-4">Ingresá a tu cuenta</h1>
      <p class="mt-2 max-w-[320px] text-[13.5px] leading-relaxed text-plomo">
        Reservá tu cochera o gestioná la ocupación de tu estacionamiento.
      </p>
    </header>

    <div class="rounded-tarjeta border border-borde bg-papel p-6 shadow-flotante lg:p-7">
      <form class="flex flex-col gap-4" [formGroup]="formulario" (ngSubmit)="enviar()">
        <label class="campo">
          <span class="label-campo">Email</span>
          <input
            type="email"
            formControlName="email"
            autocomplete="email"
            placeholder="tu@email.com"
          />
        </label>

        <label class="campo">
          <span class="label-campo">Contraseña</span>
          <input
            type="password"
            formControlName="password"
            autocomplete="current-password"
            placeholder="••••••••"
          />
        </label>

        @if (error(); as mensaje) {
          <p
            class="rounded-control border border-ocupada/25 bg-ocupada/5 px-4 py-3 text-[13px]
                   text-ocupada"
            role="alert"
          >
            {{ mensaje }}
          </p>
        }

        <ui-boton
          class="mt-1"
          variante="primario"
          tipo="submit"
          [bloque]="true"
          [cargando]="enviando()"
        >
          Ingresar
        </ui-boton>
      </form>
    </div>

    <p class="mt-6 text-center text-[13px] text-plomo">
      ¿No tenés cuenta?
      <a class="font-semibold text-acento hover:text-acento-fuerte" routerLink="/registrarse">
        Registrate
      </a>
    </p>
  </div>
</div>
