<div class="aparece mx-auto w-full max-w-[720px] px-6 pt-5 pb-8 lg:px-10 lg:pt-[34px] lg:pb-11">
  <div class="flex flex-col gap-6">
    <header>
      <a
        class="inline-flex items-center gap-1.5 rounded-boton text-[12px] font-medium text-plomo
               transition-colors duration-160 ease-out hover:text-acento"
        routerLink="/propietario/estacionamientos"
      >
        ← Mis estacionamientos
      </a>
      <p class="eyebrow mt-3">Propietario</p>
      <h1 class="titulo-vista mt-1.5">Nuevo estacionamiento</h1>
    </header>

    @if (avisoFoto(); as id) {
      <p
        class="rounded-control border border-baja/25 bg-baja/5 px-4 py-3 text-[13px] text-baja"
        role="alert"
      >
        Creamos el estacionamiento, pero no pudimos subir la foto. Podés reintentar desde Editar.
      </p>
      <ui-boton variante="primario" [bloque]="true" (presionado)="continuarSinFoto()">
        Continuar sin la foto
      </ui-boton>
    } @else {
      <app-formulario-estacionamiento
        textoEnviar="Crear estacionamiento"
        [enviando]="enviando()"
        [error]="error()"
        (guardar)="crear($event)"
        (fotoElegida)="elegirFoto($event)"
      />
    }
  </div>
</div>
