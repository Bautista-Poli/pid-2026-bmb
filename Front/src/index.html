<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Parkit</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1e3a5f">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <script>
    // Estampa el tema elegido antes de que Angular arranque: si esperaramos al
    // TemaService, la primera pintada seria clara y se veria el parpadeo.
    try {
      var tema = localStorage.getItem('parkit.tema');
      if (tema === 'claro' || tema === 'oscuro') {
        document.documentElement.setAttribute('data-theme', tema);
      }
    } catch (e) { /* sin localStorage manda el sistema */ }
  </script>
  <!-- Inter se sirve desde la app (@fontsource/inter, ver angular.json): anda sin internet. -->
</head>
<body class="bg-lienzo">
  <app-root></app-root>
</body>
</html>
