<aside class="flex h-full w-[238px] flex-col gap-7 border-r border-borde bg-papel px-[18px] py-[26px]">
  <div class="px-2">
    <ui-logo [tamano]="30" />
    <p class="mt-2.5 text-[11.5px] leading-tight text-humo">Gestión de estacionamientos</p>
  </div>

  <nav>
    <ul class="flex flex-col gap-1">
      @for (item of items(); track item.ruta) {
        <li>
          <a
            class="flex items-center gap-3 rounded-boton px-3.5 py-[11px] text-left text-[13px]
                   font-medium text-plomo transition-[background-color,box-shadow,color]
                   duration-160 ease-out hover:bg-acento-suave hover:text-acento-fuerte"
            [routerLink]="item.ruta"
            routerLinkActive="bg-acento text-sobre-acento font-semibold shadow-elevada hover:bg-acento hover:text-sobre-acento"
          >
            <ui-icono [nombre]="item.icono" [tamano]="19" />
            {{ item.etiqueta }}
          </a>
        </li>
      }
    </ul>
  </nav>

  @if (usuario(); as datos) {
    <div class="mt-auto flex items-center gap-1.5 border-t border-borde-sutil pt-3">
      <app-menu-usuario
        class="min-w-0 flex-1"
        [usuario]="datos"
        [rolAlternativo]="rolAlternativo()"
        [cambiandoRol]="cambiandoRol()"
        (cambiarRol)="cambiarRol.emit()"
        (salir)="salir.emit()"
      />
      <ui-boton-tema />
    </div>
  }
</aside>
