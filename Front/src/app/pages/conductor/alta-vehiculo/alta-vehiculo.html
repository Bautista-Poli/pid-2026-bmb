<div class="aparece pagina-alta">
  <div class="contenido-alta">
    <header>
      <a class="enlace-volver" routerLink="/conductor/vehiculos"
      >
        ← Volver a mis vehículos
      </a>
      <p class="eyebrow cabecera-alta__eyebrow">Conductor</p>
      <h1 class="titulo-vista cabecera-alta__titulo">Agregar vehículo</h1>
    </header>

    <ui-tarjeta relleno="lg">
      <app-formulario-vehiculo
        textoEnviar="Agregar vehículo"
        [enviando]="enviando()"
        [error]="error()"
        [mostrarHintPrimero]="esPrimero()"
        (guardar)="guardar($event)"
        (fotoElegida)="elegirFoto($event)"
      />
      @if (progresoFoto() !== null) {
        <p class="progreso-foto num-tabular" role="status">Subiendo la foto… {{ progresoFoto() }}%</p>
      }

    </ui-tarjeta>
  </div>
</div>
